name: Build C5X Traffic HUD APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Explicitly accept any remaining SDK licenses in non-interactive CI.
      - name: Accept remaining Android SDK licenses
        shell: bash
        run: |
          # sdkmanager exits after accepting licenses; yes may receive SIGPIPE.
          # Disable pipefail so the step reports sdkmanager's exit status.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both debug APKs
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C5X-Traffic-HUD-debug-apks
          path: |
            car-receiver/build/outputs/apk/debug/*.apk
            phone-sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
